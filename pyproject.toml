[project]
name = "aiep"
version = "0.0.1"
description = "Local harness for evaluating coding agents on SWE-bench Lite tasks."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "swebench==5.0.2",
    "pyarrow==26.0.1",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
